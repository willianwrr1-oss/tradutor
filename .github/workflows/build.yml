name: Gerar .exe (Windows)

on:
  workflow_dispatch:        # botão "Run workflow" na aba Actions
  push:
    tags:
      - "v*"                # ao criar uma tag como v1.0.0, publica uma Release

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Compilar com PyInstaller
        run: >
          pyinstaller --noconfirm --clean --windowed
          --name TradutorAudio
          --collect-all faster_whisper
          --collect-all ctranslate2
          --collect-all onnxruntime
          --collect-all av
          --collect-all tokenizers
          --hidden-import pyaudiowpatch
          tradutor_audio.py

      - name: Incluir arquivos auxiliares
        shell: pwsh
        run: |
          Copy-Item tradutor_config.exemplo.json dist/TradutorAudio/
          Copy-Item README.md dist/TradutorAudio/LEIA-ME.md

      - name: Compactar
        shell: pwsh
        run: Compress-Archive -Path dist/TradutorAudio -DestinationPath TradutorAudio-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: TradutorAudio-windows
          path: TradutorAudio-windows.zip

      - name: Publicar Release (somente em tags)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: TradutorAudio-windows.zip
